name: Validate skill and examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_public_export.py
      - run: python scripts/newspic.py render examples/demo
      - run: python scripts/newspic.py render examples/demo-seven
      - run: python scripts/wechat_draft.py plan examples/demo-seven
